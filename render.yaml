services:
  - type: web
    name: mge-social-command-center
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # All secret env vars are managed exclusively in the Render dashboard.
      # Do NOT add sync:false entries here -- Render's blueprint sync can wipe
      # dashboard-set values for any key listed in this file, even with sync:false.
